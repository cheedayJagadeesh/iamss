name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - testing-leftmenucode
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - testing-leftmenucode

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v3

      # 🔥 Step 1: Setup Node (important for Angular 16)
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # 🔥 Step 2: Install dependencies
      - name: Install dependencies
        run: npm install

      # 🔥 Step 3: Replace environment file with GitHub secrets
      - name: Replace environment file
        run: |
          echo "export const environment = {
            production: true,
            redirectUri: '${{ secrets.TEST_DNS_REDIRECT_URI }}',
            postLogoutUri: '${{ secrets.TEST_DNS_POST_LOGOUT_URI }}'
          };" > src/environments/environment.prod.ts

      # 🔥 Step 4: Build Angular app
      - name: Build Angular App
        run: npm run build -- --configuration production

      # 🔥 Step 5: Get ID Token
      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
          script: |
            const core = require('@actions/core')
            return await core.getIDToken()
          result-encoding: string

      # 🔥 Step 6: Deploy to Azure Static Web Apps
      - name: Build And Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_NICE_OCEAN_0290A8110 }}
          action: "upload"
          app_location: "/"
          output_location: "dist/iams"
          github_id_token: ${{ steps.idtoken.outputs.result }}

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job

    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "close"
