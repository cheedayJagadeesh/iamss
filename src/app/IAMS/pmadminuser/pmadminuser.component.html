<app-header></app-header>
<div class="p-3 mb-2">
    <h2 class="h2" >PM Admin User</h2>
    <!-- <button type="button" class="btn btn-dark btnback" routerLink="/dashboard">Back</button> -->
</div>
<form class="row g-3"  #pmadminform="ngForm"  (ngSubmit)="submitdata(pmadminform.value)" >
    <div class="container-top">
    <h3 class="h3">Modify User Leaves, Login and Logout</h3>
    <div class="cal">
        <label class="lblcal">Choose Date</label>
        <input class="inputcal" type="date" name="selectedDate" [(ngModel)]="selectedDate">
    </div>
    <div class="row g-3">
    <div class="col-md-3">
        <label for="Empname" class="form-label">Emp.Name</label>
    </div>
    <div class="col-md-3">
        <input type="search" class="form-controlsearchname" id="Empname" name="searchname" placeholder="Enter Employee Name" [(ngModel)]="searchname">
    </div>
    <div class="col-md-3">
        <label for="Empid" class="labelid-role1">Emp.ID</label>
    </div>
    <!-- <div class="col-md-3">
        <input type="text" class="form-control" id="Empid">
    </div> -->
    <div>
        <div>
          <input type="search" class="form-controlsearchid" name="searchid" placeholder="Enter Employee ID"  [(ngModel)]="searchid" />
        </div>
        <div>
        <button class="btn btnsearch">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
                <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
              </svg>
        </button>
    </div>
    </div>
    <div>
    <label class="labeltime1">Login Time</label>
    <input class="time1" type="time" name="time1" [(ngModel)]="time1" [disabled]="isSecondSelectDisabled">
    <label class="labeltime2">Logout Time</label>
    <input class="time2" type="time" name="time2" [(ngModel)]="time2" [disabled]="isSecondSelectDisabled">
    </div>
    <!-- <div class="col-md-3">
        <label for="Role" class="labelid-role2">Leave</label>
    </div> -->
    <div class="col-md-3">
        <label class="labeldrp1">Leave</label>
       <div >
        <select id="select1" name="leavetype" class="drpdwn1" name="leavetype"[(ngModel)]="leave" (change)="onSelect1Change()">
           <option value="" disabled selected>- select leave type -</option>
           <option value="Full Day">Full Day</option>
           <option value="Half Day">Half Day</option>
           <option value="OH(Optional Holiday)">OH(Optional Holiday)</option>
      </select>
      </div>
    </div>
    <div>
        <button class="buttonsave">Save</button>
      </div>
      <div>
        <button class="buttonclr" (click)="clearData()">Clear</button>
      </div>
    </div>
    </div>
    
    <div class="container-bottom">
        <label class="lbltwd">Total Working Days</label>
        <input class="inputtwd" type="text">
        <label class="lblheader">Employee Attendance Details</label>
        <label class="lbltlc">Total Leave Count</label>
        <input class="inputtlc" type="text">
        <div class="tablebottom">
          <table class="table table-striped table-bordered">
              <thead class="table-primary">
                  <tr>
                    <th scope="col">Emp.ID</th>
                    <th scope="col">Emp.Name</th>
                    <th scope="col">Project Name</th>
                    <th scope="col">Date</th>
                    <th scope="col">Login</th>
                    <th scope="col">Logout</th>
                    <th scope="col">Extra Hours</th>
                    <th scope="col">Total Working Hours</th>
                    <th scope="col">Leaves</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                      <th scope="row">1</th>
                      <td>Mark</td>
                      <td>Otto</td>
                   
                  </tr>
                  <tr>
                      <th scope="row">2</th>
                      <td>Mark</td>
                      <td>Otto</td>
                    
                  </tr>
                  <tr>
                      <th scope="row">3</th>
                      <td>Mark</td>
                      <td>Otto</td>
                  </tr>
                  <tr>
                      <th scope="row">4</th>
                      <td>Mark</td>
                      <td>Otto</td>
                  </tr>
                  <tr>
                      <th scope="row">5</th>
                      <td>Mark</td>
                      <td>Otto</td>
                  </tr>
                </tbody>
            </table>
        </div>
        <div class="pagination">
          <nav aria-label="Page navigation example">
              <ul class="pagination">
                <li class="page-item"><a class="page-link" href="#">Previous</a></li>
                <li class="page-item"><a class="page-link" href="#">1</a></li>
                <li class="page-item"><a class="page-link" href="#">2</a></li>
                <li class="page-item"><a class="page-link" href="#">3</a></li>
                <li class="page-item"><a class="page-link" href="#">Next</a></li>
              </ul>
            </nav>
        </div>
      </div>
</form>
