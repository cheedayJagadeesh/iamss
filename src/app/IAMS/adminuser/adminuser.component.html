<app-attendanceheader></app-attendanceheader>
<form class="g-3" #adminform="ngForm" (ngSubmit)="submitdata(adminform.value)">
  <div class="container border p-4 rounded bg-light w-75 mx-auto">
    <h3 class="text-danger fw-bold mb-4">Modify User Leaves, Login and Logout</h3>

    <div class="row mb-3 align-items-end">
      <div class="col-md-4">
        <label for="selectedDate" class="form-label">Choose Date</label>
        <input class="form-control" type="date" id="selectedDate" [(ngModel)]="selectedDate">
      </div>

      <div class="col-md-4">
        <label for="Empname" class="form-label">Emp. Name</label>
        <input type="text" class="form-control" id="Empname" placeholder="Enter Employee Name" [(ngModel)]="searchname">
      </div>

      <div class="col-md-4">
        <label for="Empid" class="form-label">Emp. ID</label>
        <div class="input-group">
          <input type="text" class="form-control" id="Empid" placeholder="Enter Employee ID" [(ngModel)]="searchid">
          <button class="btn btn-primary" type="button">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-search"
              viewBox="0 0 16 16">
              <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 
         3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 
         6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-md-4">
        <label for="select1" class="form-label">Leave</label>
        <select id="select1" class="form-select" [(ngModel)]="leave" (change)="onSelect1Change()">
          <option value="" disabled selected>- select leave type -</option>
          <option value="Full Day">Full Day</option>
          <option value="Half Day">Half Day</option>
          <option value="OH(Optional Holiday)">OH(Optional Holiday)</option>
        </select>
      </div>

      <div class="col-md-4">
        <label for="time1" class="form-label">Login Time</label>
        <input type="time" class="form-control" id="time1" [(ngModel)]="time1" [disabled]="isSecondSelectDisabled">
      </div>

      <div class="col-md-4">
        <label for="time2" class="form-label">Logout Time</label>
        <input type="time" class="form-control" id="time2" [(ngModel)]="time2" [disabled]="isSecondSelectDisabled">
      </div>
    </div>

    <div class="d-flex justify-content-center gap-3">
      <button class="btn btn-success" type="button">Save</button>
      <button class="btn btn-secondary" type="button" (click)="clearData()">Clear</button>
    </div>
  </div>
  <!-- Changes for latest -->
  <div class="mt-4">
    <div class="row g-3">
      <!-- Left Container: Holidays Table -->
      <div class="container-table col-md-6">
        <div >
          <h2 class="notify">Inteq Holidays</h2>
        </div>
        <div class="tablebottom">
          <table class="table table-striped table-bordered">
            <thead class="table-primary">
              <tr align="center">
                <th scope="col">Date</th>
                <th scope="col">Holiday</th>
                <th scope="col">Action</th>
              </tr>
            </thead>
            <tbody>
              <tr align="center">
                <th scope="row">10-10-2020</th>
                <td>Dasara</td>

                <td>
                  <!-- <button type="button" class="btn btn-primary me-1">Add</button>
                                 <button type="button" class="btn btn-info me-1">Edit</button>
                                 <button type="button" class="btn btn-danger me-1">Delete</button>
                                 <button type="button" class="btn btn-success me-1">Save</button> -->
                  <button type="button" class="btn btn-info me-1" data-bs-toggle="modal" data-bs-target="#exampleModal">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                      class="bi bi-plus-square" viewBox="0 0 16 16">
                      <path
                        d="M14 1a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1zM2 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2z" />
                      <path
                        d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4" />
                    </svg>
                  </button>

                  <!-- Modal -->
                  <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel"
                    aria-hidden="true">
                    <div class="modal-dialog">
                      <div class="modal-content">
                        <div class="modal-header">
                          <h5 class="modeltitle" id="exampleModalLabel">Add Hoildays</h5>
                          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                          <div class="cal">
                            <label class="modelcallbl">Choose Date </label>
                            <input class="modelcal" type="date" name="selectedDate" [(ngModel)]="selectedDate">
                          </div>
                          <div class="col-md-3">
                            <label class="modelhldlbl">Holiday</label>
                          </div>
                          <div class="col-md-3">
                            <input type="text" class="modelhldname" id="hldname" name="addholidays"
                              [(ngModel)]="addholidays">
                          </div>
                        </div>
                        <div class="modal-footer">
                          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                          <button type="button" class="btn btn-primary" (click)="addholiday()">Save</button>
                        </div>
                      </div>
                    </div>
                  </div>


                  <button class="btn btn-info me-1" data-bs-toggle="modal" data-bs-target="#exampleModaledit">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                      class="bi bi-pencil-square" viewBox="0 0 16 16">
                      <path
                        d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293zm-1.75 2.456-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.814z" />
                      <path fill-rule="evenodd"
                        d="M1 13.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5v-6a.5.5 0 0 0-1 0v6a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5H9a.5.5 0 0 0 0-1H2.5A1.5 1.5 0 0 0 1 2.5z" />
                    </svg>
                  </button>

                  <!-- Modal -->
                  <div class="modal fade" id="exampleModaledit" tabindex="-1" aria-labelledby="exampleModalLabel"
                    aria-hidden="true">
                    <div class="modal-dialog">
                      <div class="modal-content">
                        <div class="modal-header">
                          <h5 class="modeltitle" id="exampleModalLabel">Edit Hoildays</h5>
                          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                          <div class="cal">
                            <label class="modelcallbl">Choose Date </label>
                            <input class="modelcal" type="date" name="selectedDate" [(ngModel)]="selectedDate">
                          </div>
                          <div class="col-md-3">
                            <label class="modelhldlbl">Holiday</label>
                          </div>
                          <div class="col-md-3">
                            <input type="text" class="modelhldname" id="hldname" name="editholidays"
                              [(ngModel)]="editholidays">
                          </div>
                        </div>
                        <div class="modal-footer">
                          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                          <button type="button" class="btn btn-primary" (click)="editholiday()">Save</button>
                        </div>
                      </div>
                    </div>
                  </div>

                  <button class="btn btn-info me-1">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                      class="bi bi-trash-fill" viewBox="0 0 16 16">
                      <path
                        d="M2.5 1a1 1 0 0 0-1 1v1a1 1 0 0 0 1 1H3v9a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V4h.5a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H10a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1zm3 4a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 .5-.5M8 5a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7A.5.5 0 0 1 8 5m3 .5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 1 0" />
                    </svg>
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <!-- Right Container: Form -->
      <div class="col-12 col-md-6">
        <div class="p-3 border rounded bg-white shadow-sm">
          <form>
            <div class="row mb-2">
              <div class="col">
                <select class="form-select">
                  <option selected>- select month -</option>
                  <option>January</option>
                  <option>February</option>
                </select>
              </div>
              <div class="col">
                <select class="form-select">
                  <option selected>- select year -</option>
                  <option>2024</option>
                  <option>2023</option>
                </select>
              </div>
            </div>

            <div class="mb-2">
              <select class="form-select">
                <option selected>- select project -</option>
                <option>NNA</option>
                <option>RTL</option>
              </select>
            </div>
            <div class="mb-2">
              <select class="form-select">
                <option selected>- select employee -</option>
                <option>Akhilpasha</option>
                <option>Jagadeesh</option>
              </select>
            </div>
            <div class="mb-2 input-group">
              <input type="text" class="form-control" id="Empid" placeholder="Enter Employee ID" [(ngModel)]="searchid">
              <button class="btn btn-primary" type="button">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-search"
                  viewBox="0 0 16 16">
                  <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 
         3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 
         6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0" />
                </svg>
              </button>
            </div>
            <div class="mb-3">
              <input type="text" class="form-control" placeholder="Total Leave Count">
            </div>
            <div class="text-center">
              <button class="btn btn-primary btnSave">Save</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</form>
