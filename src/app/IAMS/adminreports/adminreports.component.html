<form class="row g-3">
    <div>
       <div class="border p-3 mt-3 p-4 rounded shadow-sm bg-light border border-secondary">
  <div class="row">
    <!-- All Employees -->
    <div class="col-md-2 d-flex flex-column align-items-start">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="allEmployees">
        <label class="form-check-label fw-bold ms-2" for="allEmployees">All Employees</label>
      </div>
    </div>

    <!-- Project Name -->
    <div class="col-md-2">
      <label class="fw-bold">Project Name</label>
      <div class="dropdown">
        <button class="btn btn-outline-dark w-100" type="button" data-bs-toggle="dropdown">
          - Select Project -
        </button>
        <ul class="dropdown-menu">
          <li><a class="dropdown-item" href="#">NNA</a></li>
        </ul>
      </div>
    </div>

    <!-- Month -->
    <div class="col-md-2">
      <label class="fw-bold">Month</label>
      <div class="dropdown">
        <button class="btn btn-outline-dark w-100" type="button" data-bs-toggle="dropdown">
          - Select Month -
        </button>
        <ul class="dropdown-menu">
          <li><a class="dropdown-item" href="#">January</a></li>
          <li><a class="dropdown-item" href="#">February</a></li>
        </ul>
      </div>
    </div>

    <!-- Year -->
    <div class="col-md-2">
      <label class="fw-bold">Year</label>
      <div class="dropdown">
        <button class="btn btn-outline-dark w-100" type="button" data-bs-toggle="dropdown">
          - Select Year -
        </button>
        <ul class="dropdown-menu">
          <li><a class="dropdown-item" href="#">2024</a></li>
        </ul>
      </div>
    </div>

    <!-- Print/Export -->
    <div class="col-md-2 d-flex align-items-end">
      <button class="btn btn-primary w-100">Print\Export</button>
    </div>
  </div>

  <!-- Radio Buttons Row -->
  <div class="row mt-4">
    <div class="col-md-2"></div> <!-- Spacer under All Employees -->

    <div class="col-md-2">
      <div class="form-check">
        <input class="form-check-input" type="radio" name="filter" id="lossOfPay">
        <label class="form-check-label fw-bold ms-2" for="lossOfPay">Loss of Pay Emp List</label>
      </div>
    </div>

    <div class="col-md-2">
      <div class="form-check">
        <input class="form-check-input" type="radio" name="filter" id="leaves">
        <label class="form-check-label fw-bold ms-2" for="leaves">Leaves Emp List</label>
      </div>
    </div>

    <div class="col-md-2">
      <div class="form-check">
        <input class="form-check-input" type="radio" name="filter" id="medical">
        <label class="form-check-label fw-bold ms-2" for="medical">Medical \ Maternity Emp List</label>
      </div>
    </div>

    <div class="col-md-2">
      <div class="form-check">
        <input class="form-check-input" type="radio" name="filter" id="conflict">
        <label class="form-check-label fw-bold ms-2" for="conflict">Leave Conflict Emp List</label>
      </div>
    </div>
  </div>
</div>
