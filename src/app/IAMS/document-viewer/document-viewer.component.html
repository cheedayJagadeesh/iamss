<div class="popup-overlay" *ngIf="pdfUrl">
  <div class="popup-content">
    <!-- Close icon -->
    <div class="pdf-header">
      <span class="close-icon" (click)="close()">✖</span>
    </div>

    <pdf-viewer [src]="pdfUrl"
                [render-text]="true"
                [original-size]="false"
                [fit-to-page]="true"
                style="width: 100%; height: 85vh; display: block;">
    </pdf-viewer>
  </div>
</div>
