<app-header></app-header>
  <form class="row g-3" #searchform="ngForm" (ngSubmit)="searchSkills()">
    <!-- <div>
        <label class="lbllogin">Login as </label>
    </div> -->
    <div class="container">
        <div >
                <label for="skillname" class="form-label">Skill Name</label>
                <!-- <input type="text" class="form-controlsearchname" name="skillname" id="skillname"  (keyup.enter)="searchSkills()" [(ngModel)]="skillname"> -->
                <select  id="select2"  class="drpyear1" name="skillname" [(ngModel)]="skillname">                    
                    <option value="">- select skill -</option>
                    <option *ngFor="let item of Enrolledskills" [value]="item">{{ item }}</option>
                </select>
                <label class="lbltime">Email</label>
                <input type="text" class="form-control" id="time" name="mail" [(ngModel)]="mail">
                <!-- <label class="lblcal">Choose Date</label>
                <input class="inputcal" type="date" name="selectedDate" [(ngModel)]="selectedDate" > -->
                <div >
                      <label class="lblcal" for="fromDate">Choose Date Range</label>
                      <input type="date" class="inputcal" name="fromdate" id="fromDate" [(ngModel)]="fromDate">
                      <!-- <label class="cal1" for="toDate">To Date</label> -->
                      <input type="date" class="inputcal1" name="todate" id="toDate" [(ngModel)]="toDate">
                  </div>
                  
                <button class="btn btnsearch">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
                      <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
                    </svg>
              </button>
        </div>
         <div>
                <label for="Modeoftraining" class="labelid-role1">Mode of Training</label>
                <select id="select1" name="modetype" class="drpyear" [(ngModel)]="modetype">
                     <option value="">- Select Mode -</option>
                     <option >Offline</option>
                     <option >Self-Learning</option>
                     <option >Teams</option>
                </select>
              
                <!-- <button class="buttonclr" (click)="clear()">Clear</button> -->
                <button class="btn btn-clear buttonclr" (click)="clear()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-clockwise" viewBox="0 0 16 16">
                        <path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2z"/>
                        <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466"/>
                      </svg>
                </button>
         </div>
        
    </div>
    <div *ngIf="isLoading" class="loading-container">
        <span class="dot"></span>
    </div>
    <div class="tablebottom">
        <table  class="table table-striped table-bordered">
            <thead class="table-primary">
                <tr>
                  <th scope="col">Enrollment Id</th>
                  <th scope="col">Name</th>
                  <th scope="col">Email</th>
                  <th scope="col">Mobile</th>
                  <th scope="col">Skill Name</th>
                  <th scope="col">Date</th>
                  <th scope="col">Time</th>
                  <th scope="col">Skill Type</th>
                  <th scope="col">Batch Members</th>
                  <th scope="col">Registered Date</th>
                  <!-- <th scope="col">Action</th> -->
                </tr>
              </thead>
              <tbody *ngIf="!isLoading">
                <!-- <div *ngIf="isLoading; else dataTemplate" class="loading-container">
                    <span class="dot"></span>
                  </div>
                  <ng-template #dataTemplate> -->
                <tr *ngFor="let row of Registeredusers | paginate: { itemsPerPage: itemsPerPage, currentPage: page }" >
                    <td>{{row.enrollmentID}}</td>
                    <td>{{row.name}}</td>
                    <td>{{row.mail}}</td>
                    <td>{{row.mobile}}</td>
                    <td>{{row.skillName}}</td>
                    <td>{{row.date}}</td>
                    <td>{{row.time}}</td>
                    <td>{{row.venue}}</td>
                    <td>{{row.batchmembers}}</td>
                    <td>{{row.enrollmentDate}}</td>
                    <!-- <td>
                        <button class="btn btn-info me-1" (click)="deleteItem(row.enrollmentID)">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-trash-fill" viewBox="0 0 16 16">
                              <path d="M2.5 1a1 1 0 0 0-1 1v1a1 1 0 0 0 1 1H3v9a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V4h.5a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H10a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1zm3 4a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 .5-.5M8 5a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7A.5.5 0 0 1 8 5m3 .5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 1 0"/>
                            </svg>
                        </button>
                    </td> -->
                </tr>
            <!-- </ng-template> -->
              </tbody>
          </table>
          <!-- <div class="pagination">
            <nav aria-label="Page navigation example">
                <ul class="pagination justify-content-center">
                    <li class="page-item" [class.disabled]="currentPage === 1">
                      <button class="page-link" (click)="goToPage(currentPage - 1)">Previous</button>
                    </li>
              
                    <li class="page-item" *ngFor="let page of [].constructor(totalPages); let i = index"
                        [class.active]="currentPage === i + 1">
                      <button class="page-link" (click)="goToPage(i + 1)">{{ i + 1 }}</button>
                    </li>
              
                    <li class="page-item" [class.disabled]="currentPage === totalPages">
                      <button class="page-link" (click)="goToPage(currentPage + 1)">Next</button>
                    </li>
                  </ul>
                  </nav>
          </div> -->
          <!-- <div *ngFor="let item of items | paginate: { itemsPerPage: itemsPerPage, currentPage: page }">
            {{ item.id }} - {{ item.name }}
          </div> -->
          <div class="pagination" >
          <pagination-controls (pageChange)="page = $event"></pagination-controls>
          </div>
        </div>
        <!-- <meta name="viewport" content="width=device-width, initial-scale=1"> -->
  </form>
