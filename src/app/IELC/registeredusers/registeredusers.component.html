<app-header></app-header>
 <div>
        <label class="lbllogin"></label>
    </div>
<form class="row g-3" #searchform="ngForm" (ngSubmit)="searchSkills()">
  <div class="container formcont">
    <div class="row mb-3">
      <!-- Skill Name -->
      <div class="col-md-4 col-sm-6 d-flex align-items-center">
        <label for="skillname" class="form-label me-2 mb-0" style="white-space: nowrap;">Skill Name</label>
        <select id="select2" class="form-select form-select-sm text skillName" name="skillname" [(ngModel)]="skillname">
          <option value="">- select skill -</option>
          <option *ngFor="let item of Enrolledskills" [value]="item">{{ item }}</option>
        </select>
      </div>


      <!-- Email -->
      <div class="col-md-5 col-sm-6 d-flex align-items-center">
        <label for="time" class="form-label me-2 mb-0" style="white-space: nowrap;">Email</label>
        <input type="text" class="form-control form-control-sm text email" id="time" name="mail" [(ngModel)]="mail">
      </div>


      <!-- Search Button -->
      <div class="col-md-1 d-flex align-items-end">
        <button class="btn btnsearch">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-search"
            viewBox="0 0 16 16">
            <path
              d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0" />
          </svg>
        </button>
      </div>
    </div>

    <div class="row mb-3">
      <!-- Mode of Training -->
      <div class="col-md-4 col-sm-6 d-flex align-items-center">
        <label for="modetype" class="form-label me-2 mb-0" style="white-space: nowrap;">Mode of Training</label>
        <select id="select1" name="modetype" class="form-select form-select-sm text" [(ngModel)]="modetype">
          <option value="">- Select Mode -</option>
          <option>Offline</option>
          <option>Self-Learning</option>
          <option>Teams</option>
        </select>
      </div>


      <!-- Choose Date Range -->
      <div class="col-md-5 col-sm-12">
        <div class="d-flex align-items-center gap-2">
          <label class="form-label mb-1 range" for="fromDate">Choose Date Range</label>
          <input type="date" class="form-control text" id="fromDate" name="fromdate" [(ngModel)]="fromDate" />
          <input type="date" class="form-control text" id="toDate" name="todate" [(ngModel)]="toDate" />
        </div>
      </div>
      <!-- Clear Button -->
      <div class="col-md-1 d-flex align-items-end">
     <button class="btn btnsearch" (click)="clear()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-clockwise"
          viewBox="0 0 16 16">
          <path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2z" />
          <path
            d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466" />
        </svg>
      </button>
    </div>
  </div>
  </div>
  <div *ngIf="isLoading" class="loading-container">
    <span class="dot"></span>
  </div>
  <div class="tablebottom">
    <table class="table table-striped table-bordered">
      <thead class="table-primary">
        <tr>
          <th scope="col">Enrollment Id</th>
          <th scope="col">Name</th>
          <th scope="col">Email</th>
          <th scope="col">Mobile</th>
          <th scope="col">Skill Name</th>
          <th scope="col">Date</th>
          <th scope="col">Time</th>
          <th scope="col">Skill Type</th>
          <th scope="col">Batch Members</th>
          <th scope="col">Registered Date</th>
        </tr>
      </thead>
      <tbody *ngIf="!isLoading">
        <tr *ngFor="let row of Registeredusers | paginate: { itemsPerPage: itemsPerPage, currentPage: page }">
          <td>{{row.enrollmentID}}</td>
          <td>{{row.name}}</td>
          <td>{{row.mail}}</td>
          <td>{{row.mobile}}</td>
          <td>{{row.skillName}}</td>
          <td>{{row.date}}</td>
          <td>{{row.time}}</td>
          <td>{{row.venue}}</td>
          <td>{{row.batchmembers}}</td>
          <td>{{row.enrollmentDate}}</td>
        </tr>
      </tbody>
    </table>
    <div class="pagination">
      <pagination-controls (pageChange)="page = $event"></pagination-controls>
    </div>
  </div>
</form>
