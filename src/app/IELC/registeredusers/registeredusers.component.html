<!-- left menu moved to root AppComponent -->

<div class="content-wrapper" [class.sidebar-collapsed]="isSidebarClosed">
  
  <!-- Loading Animation -->
  <div *ngIf="isLoading" class="loading-container">
    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
  </div>

  <form class="row" #searchform="ngForm" (ngSubmit)="searchSkills()">
    <div class="container shadow-sm">

      <h5 class="text-center mb-4 fw-bold text-primary">Search Enrolled Users</h5>

      <div class="row g-3">
        <!-- Skill Name -->
        <div class="col-md-4 col-sm-6">
          <label for="skillname" class="form-label">Skill Name</label>
          <select id="select2" class="form-select form-select-sm" name="skillname" [(ngModel)]="skillname">
            <option value="">- Select Skill -</option>
            <option *ngFor="let item of Enrolledskills" [value]="item">{{ item }}</option>
          </select>
        </div>

        <!-- Email -->
        <div class="col-md-4 col-sm-6">
          <label for="time" class="form-label">Email</label>
          <input type="text" class="form-control form-control-sm" id="time" name="mail" [(ngModel)]="mail">
        </div>

        <!-- Mode of Training + Buttons in one row -->
        <div class="col-md-4 col-sm-12 d-flex align-items-end">
          <!-- Mode of Training dropdown -->
          <div class="me-2 flex-grow-1">
            <label for="modetype" class="form-label">Mode of Training</label>
            <select id="select1" name="modetype" class="form-select form-select-sm" [(ngModel)]="modetype">
              <option value="">- Select Mode -</option>
              <option>Offline</option>
              <option>Self-Learning</option>
              <option>Teams</option>
            </select>
          </div>
          <!-- Buttons beside dropdown -->
          <div class="d-flex align-items-end">
            <button class="btn btnsearch me-1" type="submit">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-search"
                viewBox="0 0 16 16">
                <path
                  d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0" />
              </svg>
            </button>
            <button class="btn btnsearch" type="button" (click)="clear()">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                class="bi bi-arrow-clockwise" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2z" />
                <path
                  d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466" />
              </svg>
            </button>
          </div>
        </div>
      </div>
      <!-- Date Range -->
      <div class="row mt-4">
        <div class="col-sm-6">
          <label for="fromDate" class="form-label">Choose Date Range From</label>
          <input type="date" class="form-control form-control-sm" name="fromdate" [(ngModel)]="fromDate">
        </div>
        <div class="col-sm-6">
          <label for="toDate" class="form-label">Choose Date Range To</label>
          <input type="date" class="form-control form-control-sm" name="todate" [(ngModel)]="toDate">
        </div>
      </div>

    </div>
  

  <div *ngIf="isLoading" class="loading-container">
    <span class="dot"></span>
  </div>
  <div class="tablebottom">
    <table class="table table-striped table-bordered">
      <thead class="table-primary">
        <tr>
          <th scope="col">Enrollment Id</th>
          <th scope="col">Name</th>
          <th scope="col">Email</th>
          <th scope="col">Mobile</th>
          <th scope="col">Skill Name</th>
          <th scope="col">Date</th>
          <th scope="col">Time</th>
          <th scope="col">Skill Type</th>
          <th scope="col">Batch Members</th>
          <th scope="col">Registered Date</th>
        </tr>
      </thead>
      <tbody *ngIf="!isLoading">
        <tr *ngFor="let row of Registeredusers | paginate: { itemsPerPage: itemsPerPage, currentPage: page }">
          <td>{{row.enrollmentID}}</td>
          <td>{{row.name}}</td>
          <td>{{row.mail}}</td>
          <td>{{row.mobile}}</td>
          <td>{{row.skillName}}</td>
          <td>{{row.date}}</td>
          <td>{{row.time}}</td>
          <td>{{row.venue}}</td>
          <td>{{row.batchmembers}}</td>
          <td>{{row.enrollmentDate}}</td>
        </tr>
      </tbody>
    </table>
    <div class="pagination">
      <pagination-controls (pageChange)="page = $event"></pagination-controls>
    </div>
  </div>
</form>
