
<form class="row g-3" #form="ngForm">
    <app-sprtheader></app-sprtheader>
    <img class="img" src="/assets/images/Inteq logo.png">
    <div>
        <button class="btn btn-dark btnback" routerLink="/registration">Back</button>
    </div>
    <div>
        <div>
            <label for="compliance" class="form-label">Select Compliance</label>
            <select class="form-control" [(ngModel)]="selectedCompliance" required #ComplianceRef="ngModel" name="compliance" (change)="onComplianceChange($event)">
               <option value="" disabled>- Select Compliance -</option>
               <option value="ISMS">ISMS</option>
               <option value="QMS">QMS</option>
            </select>
    
          </div>
            <div class="div1">
                <label for="project" class="form-label">Select Project</label>
                <select class="form-control" [(ngModel)]="selectedProject" name="project" required #projectlistRef="ngModel" [disabled]="!selectedCompliance" (change)="onProjectChange($event)">
          <option value="" disabled>- Select Project -</option>
          <option *ngFor="let project of projectlist" [value]="project">{{ project }}</option>
        </select>
              </div>              
              <div class="div2">
                <label for="status" class="form-label">Select Status</label>
                <select id="status" name="status" class="form-control" required #statusRef="ngModel" [(ngModel)]="selectedStatus">
                  <option value="" disabled selected>- Select Status -</option>
                  <option value="Complete">Complete</option>
                </select>
              </div>
              <!-- <label class="lblbatchpopup" *ngIf="lblbatchpopup">{{ lblbatchpopup }}</label> -->
              <div class="col-md-12 text-center mt-3">
                <button class="btn btn-info btnsrch" (click)="UpdateComplianceData()" [disabled]="form.invalid" >Submit</button> 
            </div>
           
    </div>
    <div *ngIf="isLoading" class="loading-container">
        <span class="dot"></span>
    </div>
    <div class="tablebottom" *ngIf="selectedCompliance">
        <table class="table table-striped table-bordered">
            <thead class="table-primary">
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Team</th>
                    <th scope="col">Process Owner</th>
                    <th scope="col">Jan</th>
                    <th scope="col">Feb</th>
                    <th scope="col">Mar</th>
                    <th scope="col">Apr</th>
                    <th scope="col">May</th>
                    <th scope="col">Jun</th>
                    <th scope="col">Jul</th>
                    <th scope="col">Aug</th>
                    <th scope="col">Sep</th>
                    <th scope="col">Oct</th>
                    <th scope="col">Nov</th>
                    <th scope="col">Dec</th>
                </tr>
            </thead>
            <tbody  *ngIf="!isLoading" >
                <tr *ngFor="let row of selectedTableData" >
                    <td>{{row.id}}</td>
                    <td>{{row.team}}</td>
                    <td>{{row.process_Owner}}</td>
                    <td>{{row.jan}}</td>
                    <td>{{row.feb}}</td>
                    <td>{{row.mar}}</td>
                    <td>{{row.apr}}</td>
                    <td>{{row.may}}</td>
                    <td>{{row.jun}}</td>
                    <td>{{row.jul}}</td>
                    <td>{{row.aug}}</td>
                    <td>{{row.sep}}</td>
                    <td>{{row.oct}}</td>
                    <td>{{row.nov}}</td>
                    <td>{{row.dec}}</td>
                </tr>
            </tbody>
        </table>
    </div>
</form>
