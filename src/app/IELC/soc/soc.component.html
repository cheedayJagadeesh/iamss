<form class="container py-4">

    <!-- Top Header -->
    <app-userheader pageTitle="Welcome to SOC"></app-userheader>

    <!-- CISO Section -->
    <div class="text-center mt-4">
        <h2 class="fw-bold text-primary">CISO: C V Prasad</h2>
    </div>

    <!-- Loading Overlay -->
    <div *ngIf="isLoading" class="loading-container">
        <span class="dot"></span>
    </div>

    <!-- SOC Contact Table -->
    <div class="card shadow-sm my-4 fade-in">
        <div class="card-header bg-primary text-white fw-bold">
            SOC – Contact Details
        </div>

        <div class="card-body p-0">
            <table *ngIf="!isLoading" class="table table-hover table-striped mb-0">
                <thead class="table-light sticky-top">
                    <tr>
                        <th>Contact Priority</th>
                        <th>Name</th>
                        <th>Mobile</th>
                        <th>Email</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let row of isosprtlist">
                        <td>{{ row.contactPriority }}</td>
                        <td>{{ row.name }}</td>
                        <td>{{ row.mobile }}</td>
                        <td>{{ row.email }}</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Contact Email Card -->
    <div class="card shadow-sm mb-4 fade-in delay-1">
        <div class="card-body text-center">
            <h4 class="fw-bold text-secondary">Contact Email ID</h4>
            <a href="mailto:cvprasad@inteqsolutions.com"
               class="btn btn-outline-primary fw-semibold mt-2">
               {{ email }}
            </a>
        </div>
    </div>

    <!-- Section Title -->
    <h3 class="fw-bold text-center text-primary mt-5 fade-in delay-2">
        SOC Knowledgebase for ISO Team
    </h3>

    <!-- SOC Knowledgebase Table -->
    <div class="card shadow-sm my-4 fade-in delay-3">
        <div class="card-header bg-info text-white fw-bold">
            SOC – Reference Documents
        </div>

        <div class="card-body p-0">
            <table *ngIf="!isLoading" class="table table-hover mb-0">
                <thead class="table-light sticky-top">
                    <tr>
                        <th style="width:70%">Document Name</th>
                        <th style="width:30%">Share Path</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let item of socdata">
                        <td>{{ item.documentName }}</td>
                        <td>
                            <a [href]="item.url" target="_blank">Click Here</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</form>
