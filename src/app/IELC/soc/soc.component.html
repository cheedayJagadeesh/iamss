<form class="row g-3">
    <div>
        <label class="lbllogin">Login as </label>
    </div>
    <img class="img" src="\assets\images\Inteq logo.png">
    <div>
        <button class="btn btn-dark btnback" routerLink="/registration">Back</button>
    </div>
    <h1 class="h1">Welcome to SOC</h1>
    <h2 class="h2">CISO: C V Prasad</h2>
    <div *ngIf="isLoading" class="loading-container">
        <span class="dot"></span>
    </div>
    <div class="tablebottom">
        <table *ngIf="!isLoading" class="table table-striped table-bordered" name="iso27001">
            <thead class="table-primary">
                <tr>
                    <th scope="col">Contact Priority</th>
                    <th scope="col">Name</th>
                    <th scope="col">Mobile</th>
                    <th scope="col">Email</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let row of isosprtlist" >
                    <td>{{row.contactPriority}}</td>
                    <td>{{row.name}}</td>
                    <td>{{row.mobile}}</td>
                    <td>{{row.email}}</td>   
                </tr>
            </tbody>
        </table>
    </div> 
    <div class="divtext">
        <h3 class="h3">Contact Email ID:</h3>
        <a  class="btn btnlnk btn-link" href="mailto:cvprasad@inteqsolutions.com">{{email}}</a>
    </div>
    <h4 class="h4">SOC Knowledgebase for ISO</h4>
    <div class="tablebottom1">
        <table *ngIf="!isLoading" class="table table-striped table-bordered" name="soc">
            <thead class="table-primary">
                <tr>
                    <th scope="col" style="width:70%">Document Name</th>
                    <th scope="col" style="width:30%">Share Path Links</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let item of socdata">
                    <td >{{item.documentName}}</td>
                    <td>
                        <a [href]="item.url" target="_blank" rel="noopener noreferrer">Click Here</a>
                    </td> 
                </tr>
            </tbody>
        </table>
    </div>
</form>
