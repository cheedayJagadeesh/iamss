<form class="container py-4">

    <!-- Header -->
    <app-userheader pageTitle="Welcome to INTEQ Emergency Contact List"></app-userheader>

    <!-- Loader -->
    <div *ngIf="isLoading" class="loading-container">
        <span class="dot"></span>
    </div>

    <!-- Emergency Contact List -->
    <div class="card shadow-sm my-4 fade-in">
        <div class="card-header bg-danger text-white fw-bold">
            Emergency Contact Details
        </div>

        <div class="card-body p-0">
            <table *ngIf="!isLoading" class="table table-hover table-striped mb-0">
                <thead class="table-light sticky-top">
                    <tr>
                        <th>Functions / Operations / Projects</th>
                        <th>Name</th>
                        <th>Mobile</th>
                        <th>Email</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let row of emersprtlist">
                        <td>{{row.functions}}</td>
                        <td>{{row.name}}</td>
                        <td>{{row.mobile}}</td>
                        <td>{{row.email}}</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Emergency Reference Docs Section Title -->
    <h3 class="fw-bold text-center text-primary mt-5 fade-in delay-1">
        Emergency Reference Documents
    </h3>

    <!-- Emergency Documents -->
    <div class="card shadow-sm my-4 fade-in delay-2">
        <div class="card-header bg-info text-white fw-bold">
            Reference Documents
        </div>

        <div class="card-body p-0">
            <table *ngIf="!isLoading" class="table table-hover mb-0">
                <thead class="table-light sticky-top">
                    <tr>
                        <th style="width:70%">Document Name</th>
                        <th style="width:30%">Share Path</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let item of EmerGeneraldata">
                        <td>{{item.documentName}}</td>
                        <td>
                            <a [href]="item.url" target="_blank">Click Here</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</form>
