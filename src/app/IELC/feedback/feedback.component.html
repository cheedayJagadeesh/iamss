<form class="container py-4 fade-in" #form="ngForm">
    <app-userheader pageTitle="Assessment Feedback Details"></app-userheader>

    <div class="feedback-header text-center mb-3">
        <p *ngIf="selectedSkill" class="info-text">
            Skill: <strong>{{ selectedSkill }}</strong>
            ID: <strong>{{ enrollmentID }}</strong>
        </p>
        <!-- <p *ngIf="enrollmentID" class="info-text">
            ID: <strong>{{ enrollmentID }}</strong>
        </p> -->
    </div>

    <div class="card shadow-lg feedback-card p-4">
        <div class="form-group mb-3" *ngFor="let item of [
              {label:'Subject Matter Knowledge', model:'subjectMatterKnowledge'},
              {label:'Presentation', model:'presentation'},
              {label:'Communication', model:'communication'},
              {label:'Handling Doubts', model:'handlingDoubts'},
              {label:'Application to Work', model:'applicationtowork'}
            ]">

            <label class="form-label fw-semibold">{{ item.label }}:</label>

            <div class="d-flex flex-wrap gap-3">
                <label class="radio-pill" *ngFor="let rate of ['Excellent','Very Good','Good','Fair','Poor']">
                    <input type="radio" [name]="item.model"
                           [(ngModel)]="feedbackdata[item.model]"
                           required
                           [value]="rate">
                    {{ rate }}
                </label>
            </div>
        </div>

        <div class="form-group mt-4">
            <label class="form-label fw-semibold">Comments:</label>
            <textarea name="comments"
                      class="form-control"
                      placeholder="Tell us about your experience..."
                      [(ngModel)]="feedbackdata.comments"
                      required></textarea>
        </div>

        <div class="text-center mt-4">
            <button class="btn btn-primary btn-lg px-4"
                    (click)="UpdateFeedback()"
                    [disabled]="form.invalid"
                    type="button"
                    style="min-height: 45px; min-width: 200px; visibility: visible; display: inline-block;">
                Submit Feedback
            </button>
        </div>
    </div>
</form>
