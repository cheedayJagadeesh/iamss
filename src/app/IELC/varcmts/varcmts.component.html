<form class="container py-4">

    <!-- Page Header -->
    <app-userheader pageTitle="Welcome to INTEQ Various Committees Details"></app-userheader>

    <!-- Section Title -->
    <div class="text-center mt-4 mb-3 fade-in">
        <h3 class="fw-bold text-primary">Various Committees Reference Documents</h3>
    </div>

    <!-- Loading -->
    <div *ngIf="isLoading" class="loading-container">
        <span class="dot"></span>
    </div>

    <!-- Committees Table -->
    <div class="card shadow-sm fade-in delay-1 my-4">
        <div class="card-header bg-info text-white fw-bold">
            Committees – Document Repository
        </div>

        <div class="card-body p-0">
            <table class="table table-hover table-striped mb-0" name="varcmts">
                <thead class="table-light sticky-top">
                    <tr>
                        <th style="width:70%">Document Name</th>
                        <th style="width:30%">URL</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let item of varcmtlist">
                        <td>{{item.documentName}}</td>
                        <td>
                            <a [href]="item.url" target="_blank" class="text-decoration-none">
                                Click Here
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</form>
