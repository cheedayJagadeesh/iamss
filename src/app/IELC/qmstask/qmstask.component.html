<app-qmsheader></app-qmsheader>
<form #form="ngForm">
    <div *ngIf="isLoading" class="loading-container">
        <span class="dot"></span>
    </div>
    <div class="tablebottom">
        <table *ngIf="!isLoading" class="table table-striped table-bordered">
            <thead class="table-primary">
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Team</th>
                    <th scope="col">Process Owner</th>
                    <th scope="col">Jan</th>
                    <th scope="col">Feb</th>
                    <th scope="col">Mar</th>
                    <th scope="col">Apr</th>
                    <th scope="col">May</th>
                    <th scope="col">Jun</th>
                    <th scope="col">Jul</th>
                    <th scope="col">Aug</th>
                    <th scope="col">Sep</th>
                    <th scope="col">Oct</th>
                    <th scope="col">Nov</th>
                    <th scope="col">Dec</th>
                    <th scope="col">Action</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let row of qmscalendarlist | paginate: { itemsPerPage: itemsPerPage, currentPage: page }">
                    <td>{{row.id}}</td>
                    <td>{{row.team}}</td>
                    <td>{{row.process_Owner}}</td>
                    <td>{{row.jan}}</td>
                    <td>{{row.feb}}</td>
                    <td>{{row.mar}}</td>
                    <td>{{row.apr}}</td>
                    <td>{{row.may}}</td>
                    <td>{{row.jun}}</td>
                    <td>{{row.jul}}</td>
                    <td>{{row.aug}}</td>
                    <td>{{row.sep}}</td>
                    <td>{{row.oct}}</td>
                    <td>{{row.nov}}</td>
                    <td>{{row.dec}}</td>
                    <td> 
                        
                        <button type="button" class="btn btn-info me-1" data-bs-toggle="modal"
                            data-bs-target="#exampleModal">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                                class="bi bi-plus-square" viewBox="0 0 16 16">
                                <path
                                    d="M14 1a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1zM2 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2z" />
                                <path
                                    d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4" />
                            </svg>
                        </button>
                        <!-- Modal -->
                        <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel"
                            aria-hidden="true">
                            <div class="modal-dialog modal-dialog-scrollable">
                                <div class="modal-content">
                                    <div class="modal-header">
                                        <h5 class="modal-title headermodal" id="exampleModalLabel">Add Record</h5>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal"
                                            aria-label="Close" (click)="resetlist(); GetQmscalendarlist()"></button>
                                    </div>
                                    <div class="modal-body">
                                        <div class="divmodal">
                                            <label>Team</label>
                                            <input type="text" class="form-control" name="team" [(ngModel)]="calendardata.team">
                                           </div>
                                           <div class="divmodal">
                                            <label>Process Owner</label>
                                            <input type="text" class="form-control" name="processowner" [(ngModel)]="calendardata.process_Owner">
                                           </div>
                                           <div class="divmodal">
                                            <label>Jan</label>
                                            <input type="text" class="form-control" name="jan" [(ngModel)]="calendardata.jan">
                                           </div>
                                           <div class="divmodal">
                                            <label>Feb</label>
                                            <input type="text" class="form-control" name="feb" [(ngModel)]="calendardata.feb">
                                           </div>
                                           <div class="divmodal">
                                            <label>Mar</label>
                                            <input type="text" class="form-control" name="mar" [(ngModel)]="calendardata.mar">
                                           </div>
                                           <div class="divmodal">
                                            <label>Apr</label>
                                            <input type="text" class="form-control" name="apr" [(ngModel)]="calendardata.apr">
                                           </div>
                                           <div class="divmodal">
                                            <label>May</label>
                                            <input type="text" class="form-control" name="may" [(ngModel)]="calendardata.may">
                                           </div>
                                           <div class="divmodal">
                                            <label>Jun</label>
                                            <input type="text" class="form-control" name="jun" [(ngModel)]="calendardata.jun">
                                           </div>
                                           <div class="divmodal">
                                            <label>Jul</label>
                                            <input type="text" class="form-control" name="jul" [(ngModel)]="calendardata.jul">
                                           </div>
                                           <div class="divmodal">
                                            <label>Aug</label>
                                            <input type="text" class="form-control" name="aug" [(ngModel)]="calendardata.aug">
                                           </div>
                                           <div class="divmodal">
                                            <label>Sep</label>
                                            <input type="text" class="form-control" name="sep" [(ngModel)]="calendardata.sep">
                                           </div>
                                           <div class="divmodal">
                                            <label>Oct</label>
                                            <input type="text" class="form-control" name="oct" [(ngModel)]="calendardata.oct">
                                           </div>
                                           <div class="divmodal">
                                            <label>Nov</label>
                                            <input type="text" class="form-control" name="nov" [(ngModel)]="calendardata.nov">
                                           </div>
                                           <div class="divmodal">
                                            <label>Dec</label>
                                            <input type="text" class="form-control"name="dec" [(ngModel)]="calendardata.dec">
                                           </div>
                                    </div>
                                    <div class="modal-footer">
                                        <button type="button" class="btn btn-secondary"
                                            data-bs-dismiss="modal" (click)="resetlist(); GetQmscalendarlist()">Close</button>
                                        <button type="button" class="btn btn-primary" data-bs-dismiss="modal" (click)="AddQmscalendar()">Add</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <button class="btn btn-info me-1" data-bs-toggle="modal" data-bs-target="#exampleModaledit" (click)="EditQmscalendar(row.id)">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                                class="bi bi-pencil-square" viewBox="0 0 16 16">
                                <path
                                    d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293zm-1.75 2.456-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.814z" />
                                <path fill-rule="evenodd"
                                    d="M1 13.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5v-6a.5.5 0 0 0-1 0v6a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5H9a.5.5 0 0 0 0-1H2.5A1.5 1.5 0 0 0 1 2.5z" />
                            </svg>
                        </button>
                    <!-- Modal -->
                    <div class="modal fade" id="exampleModaledit" tabindex="-1" aria-labelledby="exampleModalLabel"
                    aria-hidden="true">
                    <div class="modal-dialog modal-dialog-scrollable">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title headermodal" id="exampleModalLabel">Edit Record</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"
                                    aria-label="Close" (click)="GetQmscalendarlist()"></button>
                            </div>
                            <div class="modal-body">
                              <div class="divmodal">
                                  <label>Team</label>
                                  <input type="text" class="form-control" name="team" [(ngModel)]="calendardata.team">
                                 </div>
                                 <div class="divmodal">
                                  <label>Process Owner</label>
                                  <input type="text" class="form-control" name="processowner" [(ngModel)]="calendardata.process_Owner">
                                 </div>
                                 <div class="divmodal">
                                  <label>Jan</label>
                                  <input type="text" class="form-control" name="jan" [(ngModel)]="calendardata.jan">
                                 </div>
                                 <div class="divmodal">
                                  <label>Feb</label>
                                  <input type="text" class="form-control" name="feb" [(ngModel)]="calendardata.feb">
                                 </div>
                                 <div class="divmodal">
                                  <label>Mar</label>
                                  <input type="text" class="form-control" name="mar" [(ngModel)]="calendardata.mar">
                                 </div>
                                 <div class="divmodal">
                                  <label>Apr</label>
                                  <input type="text" class="form-control" name="apr" [(ngModel)]="calendardata.apr">
                                 </div>
                                 <div class="divmodal">
                                  <label>May</label>
                                  <input type="text" class="form-control" name="may" [(ngModel)]="calendardata.may">
                                 </div>
                                 <div class="divmodal">
                                  <label>Jun</label>
                                  <input type="text" class="form-control" name="jun" [(ngModel)]="calendardata.jun">
                                 </div>
                                 <div class="divmodal">
                                  <label>Jul</label>
                                  <input type="text" class="form-control" name="jul" [(ngModel)]="calendardata.jul">
                                 </div>
                                 <div class="divmodal">
                                  <label>Aug</label>
                                  <input type="text" class="form-control" name="aug" [(ngModel)]="calendardata.aug">
                                 </div>
                                 <div class="divmodal">
                                  <label>Sep</label>
                                  <input type="text" class="form-control" name="sep" [(ngModel)]="calendardata.sep">
                                 </div>
                                 <div class="divmodal">
                                  <label>Oct</label>
                                  <input type="text" class="form-control" name="oct" [(ngModel)]="calendardata.oct">
                                 </div>
                                 <div class="divmodal">
                                  <label>Nov</label>
                                  <input type="text" class="form-control" name="nov" [(ngModel)]="calendardata.nov">
                                 </div>
                                 <div class="divmodal">
                                  <label>Dec</label>
                                  <input type="text" class="form-control"name="dec" [(ngModel)]="calendardata.dec">
                                 </div>
                              </div>
                              <div class="modal-footer">
                                  <button type="button" class="btn btn-secondary"
                                      data-bs-dismiss="modal" (click)="GetQmscalendarlist()">Close</button>
                                  <button type="button" class="btn btn-primary" data-bs-dismiss="modal" (click)="UpdateQmscalendar()" >Update</button>
                              </div>
                          </div>
                      </div>
                  </div>
              </td>
            </tr>
        </tbody>
    </table>
    <div class="pagination" >
        <pagination-controls (pageChange)="page = $event"></pagination-controls>
    </div>
    </div>
</form>
