<!-- Sidebar -->
<div class="sidebar" [class.collapsed]="isSidebarClosed">
   <img src="\assets\images\inteqlogos.png" alt="logo">

  <!-- Direct Links -->
  <a *ngIf="canAccess('home')" routerLink="/home" routerLinkActive="active"
     [routerLinkActiveOptions]="{ exact: true }" title="Home">
     <i>🏠</i><span>Home</span>
  </a>

  <a *ngIf="canAccess('registered')" routerLink="/registered" routerLinkActive="active"
     [routerLinkActiveOptions]="{ exact: true }" title="Registered User">
     <i>👥</i><span>RegisteredUser</span>
  </a>

  <a *ngIf="canAccess('addskill')" routerLink="/addskill" routerLinkActive="active"
     [routerLinkActiveOptions]="{ exact: true }" title="Add New Skill">
     <i>➕</i><span>AddNewSkill</span>
  </a>

  <a *ngIf="canAccess('skillqa')" routerLink="/skillqa" routerLinkActive="active"
     [routerLinkActiveOptions]="{ exact: true }" title="Skill QA">
     <i>❓</i><span>SkillQA</span>
  </a>

  <!-- Compliance Dropdown -->
  <div class="dropdown" *ngIf="canAccess('ismstask') || canAccess('qmstask') || canAccess('soc2task')">
    <a class="dropdown-toggle" title="Compliance">
      <i>📋</i><span>Compliance</span>
      <span class="arrow">▶</span>
    </a>
    <div class="dropdown-content">
      <a *ngIf="canAccess('ismstask')" routerLink="/ismstask" routerLinkActive="active" title="ISMS">ISMS Task</a>
      <a *ngIf="canAccess('qmstask')" routerLink="/qmstask" routerLinkActive="active" title="QMS">QMS Task</a>
      <a *ngIf="canAccess('soc2task')" routerLink="/soc2task" routerLinkActive="active" title="SOC2">SOC2 Task</a>
    </div>
  </div>

  <!-- Departments Dropdown -->
  <div class="dropdown" *ngIf="canAccess('admindept') || canAccess('hrdept') || canAccess('itdept')">
    <a class="dropdown-toggle" title="Departments">
      <i>🏢</i><span>AllDepts</span>
      <span class="arrow">▶</span>
    </a>
    <div class="dropdown-content">
      <a *ngIf="canAccess('admindept')" routerLink="/admindept" routerLinkActive="active">Admin Dept</a>
      <a *ngIf="canAccess('hrdept')" routerLink="/hrdept" routerLinkActive="active">HR Dept</a>
      <a *ngIf="canAccess('itdept')" routerLink="/itdept" routerLinkActive="active">IT Dept</a>
    </div>
  </div>

  <!-- Other Links -->
  <a *ngIf="canAccess('adminusers')" routerLink="/adminusers" routerLinkActive="active" title="Admin Users"><i>👤</i><span>AdminUsers</span></a>
  <a *ngIf="canAccess('attendance')" routerLink="/attendance" routerLinkActive="active" title="Attendance"><i>🕒</i><span>Attendance</span></a>
  <a *ngIf="canAccess('registration')" routerLink="/registration" routerLinkActive="active" title="Registration"><i>📝</i><span>RegistrationPage</span></a>
  <a (click)="logout()" title="Logout"><i>🚪</i><span>Logout</span></a>
</div>

<!-- Header -->
<div class="header" [class.collapsed]="isSidebarClosed">
  <h1>
    <button class="toggle-btn" (click)="toggleSidebar()">☰</button>
    Welcome to Inteq Admin Dashboard
  </h1>
    <app-sprtheader></app-sprtheader>
  <div class="profile">
    <img src="\assets\images\userlogo.png" alt="User">
  </div>
</div>

<!-- Content -->
<div class="content" [class.collapsed]="isSidebarClosed">
  <router-outlet></router-outlet>
</div>
